<title>Image mask modes preserve source alpha and use independent cached textures</title>

<div class="row" style="mask-mode:alpha"></div>
<div class="row" style="mask-mode:luminance"></div>
<div id="to-luminance" class="row" style="mask-mode:alpha"></div>
<div id="to-alpha" class="row" style="mask-mode:luminance"></div>
<script>
window.addEventListener('load', () => requestAnimationFrame(() => requestAnimationFrame(() => {
 document.getElementById('to-luminance').style.maskMode='luminance';

 requestAnimationFrame(() => requestAnimationFrame(() => document.documentElement.classList.remove('reftest-wait')));
})));
</script>
