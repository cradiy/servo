<!DOCTYPE html>
<meta charset=utf-8>
<title>Animation.effect</title>
<link rel="help" href="https://drafts.csswg.org/web-animations/#dom-animation-effect">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="../../testcommon.js"></script>
<body>
<div id="log"></div>
<script>
'use strict';

test(t => {
  const anim = new Animation();
  assert_equals(anim.effect, null, 'initial effect is null');

  const newEffect = new KeyframeEffect(createDiv(t), null);
  anim.effect = newEffect;
  assert_equals(anim.effect, newEffect, 'new effect is set');
}, 'effect is set correctly.');

test(t => {
  const div = createDiv(t);
  const animation = div.animate({ left: ['100px', '100px'] },
                                { fill: 'forwards' });
  const effect = animation.effect;

  assert_equals(getComputedStyle(div).left, '100px',
                'animation is initially having an effect');

  animation.effect = null;
  assert_equals(getComputedStyle(div).left, 'auto',
                'animation no longer has an effect');

  animation.effect = effect;
  assert_equals(getComputedStyle(div).left, '100px',
                'animation has an effect again');
}, 'Clearing and setting Animation.effect should update the computed style'
   + ' of the target element');

test(() => {
  const effect = new KeyframeEffect(null, null);
  const first = new Animation(effect);
  const second = new Animation(effect);
  assert_equals(first.effect, null);
  assert_equals(second.effect, effect);

  first.effect = effect;
  assert_equals(second.effect, null);
  assert_equals(first.effect, effect);

  first.effect = first.effect;
  assert_equals(first.effect, effect);
  first.effect = null;
  second.effect = effect;
  assert_equals(first.effect, null);
  assert_equals(second.effect, effect);
}, 'An idle effect has a single owner across construction, transfer and detachment');

test(() => {
  const firstEffect = new KeyframeEffect(null, null);
  const replacement = new KeyframeEffect(null, null);
  const first = new Animation(firstEffect);
  first.effect = replacement;
  const second = new Animation(firstEffect);
  assert_equals(first.effect, replacement);
  assert_equals(second.effect, firstEffect);
}, 'Replacing an effect clears the old effect association');

</script>
</body>
